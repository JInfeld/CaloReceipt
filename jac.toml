[project]
name = "CaloReceipt"
version = "1.0.0"
description = "Jac client application: CaloReceipt"
entry-point = "main.jac"

[dependencies.npm]
jac-client-node = "1.0.7"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "2.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[jacpack]
name = "CaloReceipt"
description = "A brief description of what this template provides"
jaclang = "0.13.3"

[serve]
base_route_app = "app"

[plugins.scale.kubernetes]
ingress_session_affinity = true

[plugins.scale.sso]
host = "http://localhost:8000/sso"

[plugins.scale.sso.google]
client_id = ""
client_secret = ""

[plugins.scale.sso.apple]
client_id = ""
client_secret = ""
team_id = ""
key_id = ""
private_key_path = ""
private_key = ""

[plugins.client]
