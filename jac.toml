[project]
name = "CaloReceipt"
version = "1.0.0"
description = "Jac client application: CaloReceipt"
entry-point = "main.jac"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[jacpack]
name = "CaloReceipt"
description = "A brief description of what this template provides"
jaclang = "0.13.3"

[serve]
base_route_app = "app"

[plugins.scale.kubernetes]
ingress_session_affinity = true

[plugins.scale.sso]
host = "http://localhost:8000/sso"

[plugins.scale.sso.google]
client_id = ""
client_secret = ""

[plugins.scale.sso.apple]
client_id = ""
client_secret = ""
team_id = ""
key_id = ""
private_key_path = ""
private_key = ""

[plugins.client]
